# docker-compose.proxy.yml
# Token-saver proxy stack для Serpentos Agent OS
# Запуск: docker compose -f docker-compose.proxy.yml up -d
# Подключение агентов:
#   export OPENAI_BASE_URL=http://localhost:4000/v1
#   export ANTHROPIC_BASE_URL=http://localhost:4000/v1

services:
  # ── LiteLLM Proxy ─────────────────────────────────────────────
  proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: serpentos-proxy
    ports:
      - "4000:4000"        # OpenAI-совместимый API
      - "4001:4001"        # LiteLLM Dashboard UI
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    environment:
      # Секреты через Doppler (никогда не хардкодить!)
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Окружение (dev/stage/prod) — из Doppler
      - DOPPLER_CONFIG=${DOPPLER_CONFIG:-dev}
    command: [
      "--config", "/app/config.yaml",
      "--port", "4000",
      "--detailed_debug"
    ]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - serpentos-proxy
    labels:
      - "serpentos.component=proxy"
      - "serpentos.env=${DOPPLER_CONFIG:-dev}"

  # ── Redis (семантический кэш + rate limiting) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: serpentos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - serpentos-proxy

  # ── PostgreSQL (budget tracking + audit trail) ────────────────
  postgres:
    image: postgres:16-alpine
    container_name: serpentos-postgres
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_via_doppler}
      - POSTGRES_DB=litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - serpentos-proxy

  # ── Ollama (локальные модели, $0) ────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: serpentos-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Автозагрузка нужных моделей при старте
    entrypoint: ["/bin/sh", "-c",
      "ollama serve & sleep 5 && ollama pull qwen2.5-coder:7b && ollama pull llama3.2:3b && wait"
    ]
    restart: unless-stopped
    networks:
      - serpentos-proxy
    # Раскомментируй если есть NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  redis-data:
  postgres-data:
  ollama-models:

networks:
  serpentos-proxy:
    name: serpentos-proxy
    driver: bridge
